[project]
name = "survspk"
version = "0.1.0"
description = "Speaker-attributed Survivor transcripts: subtitle cues + speaker embeddings + survivoR."
readme = "README.md"
requires-python = ">=3.11,<3.14"   # torch/whisperx have no cp314 wheels yet; .python-version pins 3.12
dependencies = [
    "pysubs2>=1.7",
    "rapidfuzz>=3.9",
    "pyreadr>=0.5",
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "plexapi>=4.18.2",
]

[project.optional-dependencies]
# M1+ — heavy audio/ML stack, macOS only. Install in this order so one stubborn resolver
# conflict does not block the rest:
#   uv sync --extra audio            torch + embeddings + separation
#   uv sync --extra audio --extra align      + whisperx (forced alignment)
#   uv sync --extra audio --extra align --extra diarize   + pyannote (episode-1 only)
audio = [
    "soundfile>=0.12",
    "webrtcvad-wheels>=2.0",
    "numpy>=1.26",
    "torch>=2.4",
    "torchaudio>=2.4",
    "speechbrain>=1.0",
    "demucs-mlx[convert]; sys_platform == 'darwin'",   # [convert]: one-time htdemucs -> MLX weight conversion
]
align = ["whisperx>=3.3"]
diarize = ["pyannote.audio>=3.3"]
# python-dotenv reads .env (HF_TOKEN, PLEX_*). plexapi itself is a core dependency.
plex = ["python-dotenv>=1.0"]
# Review UI.
review = ["fastapi>=0.115", "uvicorn>=0.30"]
# Chyron OCR: Apple Vision through ocrmac (macOS); pillow for the frame hand-off.
ocr = ["ocrmac>=1.0; sys_platform == 'darwin'", "pillow>=10"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx2>=2.0"]   # installed by plain `uv sync`; httpx2: starlette TestClient (review UI tests)

[project.scripts]
survspk = "survspk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["survspk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
