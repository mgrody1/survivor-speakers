# survspk default configuration.
# Paths are given per "profile". The profile is chosen by $SURVSPK_PROFILE, or auto-detected:
#   - "vm"    when ~/mnt/Stargazer exists (the Cowork Linux sandbox with folders mounted)
#   - "macos" otherwise
profiles:
  macos:
    video_root: "/Volumes/Max2NUC Files/TV Shows/Survivor (2000) {TvbId-76733}"
    subtitle_root: "/Volumes/Max2NUC Files/Subtitles"
    work_root: "/Users/maxgrody/Documents/Claude/Projects/Stargazer/survivor_audio"
    survivor_snapshot: "/Users/maxgrody/Documents/Claude/Projects/Stargazer/Gamebot/gamebot_lite/data/gamebot.sqlite"
    sqlite_journal: WAL
  vm:
    video_root: "~/mnt/Survivor (2000) {TvbId-76733}"
    subtitle_root: "~/mnt/Subtitles"
    work_root: "~/mnt/Stargazer/survivor_audio"
    survivor_snapshot: "~/mnt/Stargazer/Gamebot/gamebot_lite/data/gamebot.sqlite"
    sqlite_journal: TRUNCATE   # FUSE mount cannot delete files, so WAL/DELETE journals fail with "disk I/O error"

# Relative to work_root
layout:
  db: "db/survspk.sqlite"
  survivor_db: "survivor_data/survivor.sqlite"
  raw: "raw"
  center: "center"
  vocals: "vocals"
  embeddings: "embeddings"
  frames: "frames"

survivor:
  raw_url: "https://raw.githubusercontent.com/doehm/survivoR/master/data"
  tables: [castaways, castaway_details, boot_mapping, episodes, confessionals]

inventory:
  video_extensions: [".mkv", ".mp4", ".avi", ".m4v", ".mov", ".ts"]
  skip_title_patterns: ["reunion"]          # case-insensitive substring match on filename
  prefer_sdh: true
  max_duration_delta_s: 20                  # subtitle last-cue-end vs ffprobe duration
  max_length_delta_min: 3                   # ffprobe duration vs survivoR episode_length
  ffprobe_timeout_s: 60

subparse:
  name_prefix_min_lines: 20                 # a file "has NAME: prefixes" if at least this many lines match
  marker_min_lines: 20

storage:
  format: flac
  keep_raw: false
  make_center: ablation_only

compute:
  device: mps
  diarization_device: cpu

models:
  embedding: speechbrain/spkrec-ecapa-voxceleb
  separation: demucs-mlx:htdemucs
  alignment: whisperx-wav2vec2-en
  diarization: pyannote/speaker-diarization-3.1
  ocr: apple-vision

audio:
  sample_rate: 16000
  variant: vocals              # which variant align/embed use by default
  separation_source: raw       # raw | center (center exists only for 5.1 sources)
  make_center: when_51
  keep_raw: true               # M1 keeps raw for the ablation; flip to false at M4 to save disk
  demucs_model: htdemucs
  device: mps

align:
  pad_s: 0.4
  min_word_score: 0.3
  offset_windows: 5
  offset_window_s: 240
  max_lag_s: 90
  apply_min_offset_s: 0.25
  device: mps
  anchor: always               # cue times from faster-whisper words matched to cue words (never = envelope only)
  anchor_model: small.en       # faster-whisper model: about 7 min per hour of audio on CPU; cached in reports/align
  # mlx: the same small.en on the Apple GPU with the same Silero VAD, about 75 s per hour (scripts/asr_mlx.py, run in a
  # throwaway `uv run --no-project` env; falls back to faster-whisper if it fails). Against the median of four other
  # transcripts its cue starts were off by > 1 s for 0.8-1.1% of cues vs 1.0-3.1% for the CPU path (US31 E01, US44
  # E09, US46 E03; scripts/asr_backend_eval.py). large-v3-turbo hears 3-5% more cues but starts them ~50 ms early.
  anchor_backend: mlx
  anchor_mlx_model: mlx-community/whisper-small.en-mlx
  anchor_min_share: 0.3        # share of cue starts ASR must hear, else the envelope fit is kept

segment:
  merge_gap_s: 0.8
  merge_max_s: 12
  sdh_propagate_gap_s: 2.5
  bank_min_duration_s: 1.5
  recap_search_s: 240
  recap_gap_s: 4
  recap_max_s: 420
  run_gap_s: 1.5               # monologue run: consecutive unmarked, name-compatible utterances within this gap
  confessional_run_s: 6        # runs >= this are domain 'confessional' (validated vs survivoR counts on US47E02)

embed:
  model: speechbrain/spkrec-ecapa-voxceleb
  pad_s: 0.1
  batch_size: 32
  device: mps
  min_duration_s: 0.5

thresholds:                    # assign (spec §7.7.5), on cosine to the bank
  accept: 0.55
  margin: 0.08
  floor: 0.35
  bank_min_confidence: 0.60
  purity_min_s: 1.0            # utterances shorter than this do not vote when a run is checked for a speaker change
  auto_min_s: 2.0              # a group with less speech than this gets no auto label (audits: most misses were sub-2 s)
  calibrated_accept: true      # once `survspk calibrate --write` has saved a model, it decides auto vs review at the rule's precision (+2 points of speech auto-labelled in the 8-season replay); false: the accept/margin rule
  voice_split: true            # cut out lines whose own voice clearly prefers another speaker (two people in one run)
  voice_split_margin: 0.08     # ... by at least this much over the group's speaker
  voice_split_confident: false # false: the line need not be confident on its own (US45/US47 test: +2-3 points of precision)

bank:
  exemplars_per_speaker: 20
  recency_half_life_episodes: 3
  rolling: true                # assign refits the bank from every earlier episode first (unless --bank-as-of is given)
  use_auto_labels: false       # learn only from human, name-card and caption-name labels, never from auto labels
  score_mode: centroid         # centroid | exemplar | blend  (M1: centroid beat nearest-exemplar on US47E02)

diarize:                       # speaker-change track (Nemotron 3 Diarization via scripts/diarize_nemotron.py)
  enabled: true                # a failure only skips the two-voice suggestions
  variant: vocals

split_detect:                  # lines that sound like two people -> suggested split, queued as two_voices
  enabled: true
  min_utt_s: 2.5
  min_second_s: 0.8            # diarizer hears the second voice at least this long inside the line
  min_contrast: 0.2            # and the bank names the two sides as different people this clearly
  auto: true                   # cut automatically (lines without a human / name-card label), then re-assign
  auto_second_s: 0.5           # second voice at least this long inside the line
  auto_side_s: 0.5             # each part at least this long

chyron:                        # on-screen name cards -> `chyron` labels (survspk chyron)
  fps: 2                       # frames sampled per second across the body; cards stay up ~4 s
  diff_threshold: 6            # skip a frame whose band barely changed since the last OCR'd one (mean |delta|, 0-255)
  min_match: 85                # rapidfuzz ratio a name line must reach against the cast present
  dedupe_s: 10                 # one hit per castaway per this many seconds
  anchor_before_s: 6           # the card belongs to the utterance that started within [t-6, t+1] s ...
  anchor_after_s: 1
  anchor_ideal_s: 3            # ... ideally ~3 s before it (the card follows the first line)
  anchor: overlap              # overlap = the line most on air while the card is up (93% on US47 E01-03); start = the rule above (88%)
  left_frac: 0.62              # OCR lines starting right of this fraction of the band are the show's own captions
  hwaccel: videotoolbox        # ffmpeg decode on the Apple video engine; null to decode on CPU

franchises:
  US:
    host_id: HOST_US
    host_names: [PROBST, JEFF, "JEFF PROBST"]
    chyron_crop: [0.72, 1.0]
  AU:
    host_id: HOST_AU
    host_names: [JONATHAN, LAPAGLIA, "JONATHAN LAPAGLIA", JLP]
    chyron_crop: [0.70, 1.0]

text_prior:                    # EXPERIMENT, off by default. Local LLM vote on queued runs (survspk text-prior) via oMLX.
                               # US47E02 A/B (2026-09-07): 26% / 27% (thinking) / 37.5% (27B) precision vs explicit names.
                               # Not a labeler; kept as a research hook.
  base_url: "http://127.0.0.1:8001/v1"
  model: "Qwen3.6-35B-A3B-MLX-8bit"      # directory name under ~/models as oMLX exposes it (see GET /v1/models)
  temperature: 0.0
  max_tokens: 600
  timeout_s: 180
  concurrency: 4
  disable_thinking: true       # Qwen3.x thinking off: 10x faster, and the task is a lookup, not a derivation
  context_runs: 3
  use_in_assign: false         # never turn on below ~80% precision on `text-prior --eval-only`
  show_in_review: false        # show its vote as a candidate in the review UI
  min_confidence: 0.8
